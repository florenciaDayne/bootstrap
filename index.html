<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Demo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h1 class="text-center mb-4">Componentes Bootstrap</h1>

    <!-- ACCORDION -->
    <h2>Accordion</h2>
    <div class="accordion mb-4" id="accordionExample">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#collapseOne">
                    Item 1
                </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
                <div class="accordion-body">Contenido 1</div>
            </div>
        </div>
    </div>

    <!-- ALERTAS -->
    <h2>Alertas</h2>
    <div class="alert alert-primary">Primary</div>
    <div class="alert alert-success">Success</div>
    <div class="alert alert-danger mb-4">Danger</div>

    <!-- BADGES -->
    <h2>Badges</h2>
    <span class="badge text-bg-primary">Primary</span>
    <span class="badge text-bg-success mb-4">Success</span>

    <!-- BOTONES -->
    <h2>Botones</h2>
    <div class="btn-group mb-4">
        <button class="btn btn-danger">Left</button>
        <button class="btn btn-warning">Middle</button>
        <button class="btn btn-success">Right</button>
    </div>

    <!-- CARD -->
    <h2>Card</h2>
    <div class="card mb-4" style="width: 18rem;">
        <img src="https://via.placeholder.com/300x150" class="card-img-top">
        <div class="card-body">
            <h5 class="card-title">Título</h5>
            <p class="card-text">Texto de ejemplo</p>
            <a href="#" class="btn btn-primary">Ir</a>
        </div>
    </div>

    <!-- CAROUSEL -->
    <h2>Carousel</h2>
    <div id="carouselExample" class="carousel slide mb-4">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="foto.jpg" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="foto1.jpg" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="foto2.jpeg" class="d-block w-100">
            </div>
        </div>
        <button class="carousel-control-prev" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- DROPDOWN -->
    <h2>Dropdown</h2>
    <div class="dropdown mb-4">
        <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">
            Menú
        </button>
        <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Opción 1</a></li>
            <li><a class="dropdown-item" href="#">Opción 2</a></li>
        </ul>
    </div>

    <!-- LIST GROUP -->
    <h2>Lista</h2>
    <ul class="list-group mb-4">
        <li class="list-group-item active">Activo</li>
        <li class="list-group-item">Item 2</li>
        <li class="list-group-item">Item 3</li>
    </ul>

    <!-- PROGRESS -->
    <h2>Progress</h2>
    <div class="progress mb-2">
        <div class="progress-bar" style="width: 50%"></div>
    </div>

    <!-- SPINNER -->
    <h2>Spinner</h2>
    <div class="spinner-border text-primary mb-4"></div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
